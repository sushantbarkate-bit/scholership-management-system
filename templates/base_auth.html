<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Login{% endblock %} · Scholarship Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

{% from "_macros.html" import flash_messages %}

<div class="msp-auth-wrap">
    <div class="msp-auth-card">
        <div class="text-center mb-3">
            <a class="msp-brand justify-content-center" href="{{ url_for('public.landing') }}">
                <span class="msp-brand-mark">MS</span>
                <span>Scholarship Portal</span>
            </a>
        </div>
        <div class="msp-card">
            <div class="msp-card-header">
                <span>{% block auth_heading %}{% endblock %}</span>
            </div>
            <div class="msp-card-body">
                {{ flash_messages() }}
                {% block auth_content %}{% endblock %}
            </div>
        </div>
        <p class="text-center small text-muted mt-3 mb-0">
            Eligibility results are preliminary and are not official approvals.
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
